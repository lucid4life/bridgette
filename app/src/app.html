<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fff8ec" />
    <title>Bridgette Bar Training</title>
    <script>
      // FOUC guard: resolve the saved theme before first paint. 'bb_theme' is
      // 'light' | 'dark' | absent (= auto, the media query handles paint).
      try {
        var t = localStorage.getItem('bb_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2a211a');
      } catch (e) { /* storage unavailable: stay on auto */ }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
