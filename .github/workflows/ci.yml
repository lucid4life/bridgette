name: CI

# Runs the same gates Adrian runs locally, on every push/PR — so the data-safety
# guard, the type check, and the axe/a11y suite become real merge blockers once a
# GitHub remote exists. No deploy here (Adrian deploys).
on:
  push:
    branches: [main, v2-app]
  pull_request:

jobs:
  app:
    name: app (test · check · build · e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm install (not ci): the committed lockfile omits some platform-optional
      # native deps (@emnapi/*), which `npm ci` rejects but `npm install` resolves —
      # matching what runs locally and on Vercel.
      - run: npm install --no-audit --no-fund
      - name: Unit tests (Vitest)
        run: npm test
      - name: Type check (svelte-check)
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E + axe (Playwright)
        run: npm run test:e2e

  data:
    name: data (check_training.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # check_training.py runs `node --check`/`node -e` on src/data.js and verifies the
      # dist/ bundle is byte-in-sync — so the runner needs Node AND a fresh bundle build
      # (dist/ is gitignored, absent on a clean checkout).
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the v1 single-file bundle
        run: python build_single_file.py
      - name: v1 structural data gate
        run: python tests/check_training.py
